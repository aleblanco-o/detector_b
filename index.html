<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Brötchen-Erkenner</title>
<style>
:root{--bg:#FFFCF0;--bg2:#F2F0E5;--ui:#E6E4D9;--ui2:#DAD8CE;--tx:#100F0F;--tx2:#6F6E69;--tx3:#B7B5AC;
--or:#BC5215;--gr:#66800B;--ye:#AD8301;--bl:#205EA6;--re:#AF3029}
@media (prefers-color-scheme:dark){:root{--bg:#100F0F;--bg2:#1C1B1A;--ui:#282726;--ui2:#343331;--tx:#CECDC3;--tx2:#878580;--tx3:#575653;
--or:#DA702C;--gr:#879A39;--ye:#D0A215;--bl:#4385BE;--re:#D14D41}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:960px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:1.4rem;margin:4px 0 2px}
.sub{color:var(--tx2);margin:0 0 12px;font-size:.95rem}
.app{display:grid;gap:12px}
@media (min-width:800px){.app{grid-template-columns:minmax(0,1fr) 280px;align-items:start}}
#wrap{position:relative;width:100%;max-width:calc(75svh * 16 / 9);margin:0 auto;background:var(--bg2);border:1px solid var(--ui);border-radius:12px;overflow:hidden;min-height:180px}
video,#img{display:block;width:100%;height:auto}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.panel{display:grid;gap:12px}
#start{min-height:48px;width:100%;font:600 1.05rem system-ui,sans-serif;border:0;border-radius:12px;background:var(--tx);color:var(--bg);cursor:pointer}
#start:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
#status{color:var(--tx2);font-size:.95rem;min-height:1.4em}
.card{background:var(--bg2);border:1px solid var(--ui);border-radius:12px;padding:12px}
.card h2{font-size:.85rem;color:var(--tx2);margin:0 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.counts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.counts li{display:flex;align-items:center;gap:8px;min-height:32px}
.chip{width:14px;height:14px;border-radius:50%;flex:none}
.counts b{margin-left:auto;font-size:1.25rem;font-variant-numeric:tabular-nums}
.meta{color:var(--tx2);font-size:.8rem;margin:8px 0 0}
#testline{font:12px ui-monospace,monospace;color:var(--tx2);overflow-wrap:anywhere}
#guide{margin-top:28px}
#guide>h2{font-size:1.15rem;margin:0 0 8px}
.guide-card{display:grid;gap:4px;min-height:300px;align-content:start;max-width:560px}
.guide-card .ill{display:flex;justify-content:center;padding:4px 0 8px}.guide-card .ill svg{width:128px;height:128px}
.guide-card h3{margin:2px 0 4px;font-size:1.1rem}
.guide-card p{margin:0;color:var(--tx2)}
.num{color:var(--or);font-weight:700;font-size:.85rem}
.gnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;max-width:560px}
.gnav button{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ui2);background:var(--bg2);color:var(--tx);font:600 .95rem system-ui,sans-serif;cursor:pointer}
.gnav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:2px}
.dots button{min-width:32px;padding:0;border:0;background:none;display:grid;place-items:center}
.dots button::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ui2)}
.dots button[aria-current="step"]::after{background:var(--or);width:24px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body>
<main>
<h1>Brötchen-Erkenner</h1>
<p class="sub">Erkennt Normal-, Körner- und Sonnenblumenbrötchen live mit der Kamera.</p>
<div class="app">
  <div id="wrap" aria-label="Kamerabild mit Erkennungen"><video id="vid" playsinline muted autoplay></video><canvas id="ov" aria-hidden="true"></canvas></div>
  <div class="panel">
    <button id="start" type="button">Kamera starten</button>
    <div id="status" role="status" aria-live="polite">Bereit</div>
    <section class="card" aria-labelledby="res-h">
      <h2 id="res-h">Ergebnis</h2>
      <ul class="counts">
        <li><span class="chip" aria-hidden="true" style="background:#DA702C"></span>Normal<b id="count0">0</b></li>
        <li><span class="chip" aria-hidden="true" style="background:#879A39"></span>Körner<b id="count1">0</b></li>
        <li><span class="chip" aria-hidden="true" style="background:#D0A215"></span>Sonnenblumen<b id="count2">0</b></li>
      </ul>
      <p class="meta"><span id="fps">0</span> FPS · <span id="backend">-</span></p>
    </section>
    <div id="testline"></div>
  </div>
</div>
<section id="guide" aria-labelledby="guide-h" hidden>
  <h2 id="guide-h">So funktioniert es</h2>
  <article class="card guide-card" id="gcard" aria-live="polite"><div class="ill" aria-hidden="true"></div><span class="num"></span><h3></h3><p></p></article>
  <nav class="gnav" aria-label="Schritte">
    <button type="button" id="gprev">‹ Zurück</button>
    <div class="dots" id="gdots"></div>
    <button type="button" id="gnext">Weiter ›</button>
  </nav>
</section>
</main>
<script src="guide.js"></script>
<script>
(() => {
  const s = window.GUIDE_STEPS; if (!Array.isArray(s) || !s.length) return;
  const $ = id => document.getElementById(id), card = $('gcard'), dots = $('gdots');
  let i = 0;
  const show = n => {
    i = Math.max(0, Math.min(s.length - 1, n)); const g = s[i];
    card.querySelector('.ill').innerHTML = g.svg || '';
    card.querySelector('.num').textContent = `Schritt ${i + 1} von ${s.length}`;
    card.querySelector('h3').textContent = g.title; card.querySelector('p').textContent = g.text;
    [...dots.children].forEach((d, k) => d.setAttribute('aria-current', k == i ? 'step' : 'false'));
    $('gprev').disabled = i == 0; $('gnext').disabled = i == s.length - 1;
  };
  s.forEach((g, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Schritt ${k + 1}: ${g.title}`);
    b.onclick = () => show(k); dots.append(b);
  });
  $('gprev').onclick = () => show(i - 1); $('gnext').onclick = () => show(i + 1);
  card.onkeydown = e => e.key == 'ArrowLeft' ? show(i - 1) : e.key == 'ArrowRight' && show(i + 1);
  show(0); $('guide').hidden = false;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
<script src="app.js"></script>
</body></html>
