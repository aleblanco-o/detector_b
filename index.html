<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouse Detector</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;padding:12px;background:#111;color:#eee}
#wrap{position:relative;width:100%;max-width:640px;margin:8px 0;background:#000}
video,#img{display:block;width:100%}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
button{font-size:18px;padding:10px 20px}
</style></head><body>
<h1 style="font-size:20px;margin:0 0 8px">Mouse Detector</h1>
<button id="start">Start camera</button>
<label><input type="checkbox" id="all"> show all classes</label>
<div id="wrap"><video id="vid" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<div id="status">Idle</div>
<div>Mice: <b id="count">0</b> | FPS: <b id="fps">0</b> | Backend: <b id="backend">-</b></div>
<div id="testline"></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
<script src="app.js"></script>
<p style="font-size:12px">Test image: Wikimedia Commons, "A wireless computer mouse.jpg", CC BY-SA 4.0.</p>
</body></html>
